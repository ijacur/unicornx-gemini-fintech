        const container = document.getElementById('topicsContainer');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('toast');

        let globalIndex = 1;

        function renderTopics(filter = '') {
            container.innerHTML = '';
            let currentGlobal = 1;
            let matchCount = 0;

            topicsData.forEach(topic => {
                const matchingQuestions = topic.questions.filter(q => 
                    q[1].toLowerCase().includes(filter.toLowerCase()) || 
                    topic.topic_title.toLowerCase().includes(filter.toLowerCase())
                );

                if (matchingQuestions.length > 0) {
                    matchCount += matchingQuestions.length;
                    const card = document.createElement('div');
                    card.className = 'topic-card';

                    const header = document.createElement('div');
                    header.className = 'topic-header';
                    header.innerHTML = `
                        <div class="topic-title">${topic.topic_title}</div>
                        <div class="topic-badge">${topic.question_count} ta savol</div>
                    `;
                    card.appendChild(header);

                    const ul = document.createElement('ul');
                    ul.className = 'question-list';

                    matchingQuestions.forEach(q => {
                        const li = document.createElement('li');
                        li.className = 'question-item';
                        li.innerHTML = `
                            <span class="question-num">${q[0]}</span>
                            <span>${highlightText(q[1], filter)}</span>
                        `;
                        ul.appendChild(li);
                    });

                    card.appendChild(ul);
                    container.appendChild(card);
                }
            });

            if (matchCount === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 60px 20px; color: var(--text-secondary);">
                    <h3>Hech qanday savol topilmadi</h3>
                    <p style="margin-top: 8px;">Qidiruv so'zini o'zgartirib ko'ring.</p>
                </div>`;
            }
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
            return text.replace(regex, '<mark style="background: rgba(250, 204, 21, 0.4); color: #fff; padding: 2px 4px; border-radius: 4px;">$1</mark>');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function copyAllText() {
            let fullText = "SAMARQAND DAVLAT TIBBIYOT UNIVERSITETI\n";
            fullText += "«IQTISODIY TAHLIL» FANI NAZORAT SAVOLLARI TO'PLAMI\n";
            fullText += "Masofaviy ta'lim portali (mt.sammu.uz) | Kurs ID: 4819\n\n";

            let absIdx = 1;
            topicsData.forEach(t => {
                fullText += `=== ${t.topic_title} ===\n`;
                t.questions.forEach(q => {
                    fullText += `${absIdx}. (${q[0]}) ${q[1]}\n`;
                    absIdx++;
                });
                fullText += "\n";
            });

            navigator.clipboard.writeText(fullText).then(() => {
                showToast("Barcha 239 ta savol nusxalandi!");
            }).catch(() => {
                showToast("Nusxalashda xatolik yuz berdi");
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderTopics(e.target.value.trim());
        });

        renderTopics();
    </script>
