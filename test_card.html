<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:wght@400;600&display=swap');
  @page {
    size: 3.5in 2in;
    margin: 0;
  }
  body {
    margin: 0;
    padding: 0;
    background: #000;
  }
  .card-page {
    width: 3.5in;
    height: 2in;
    page-break-after: always;
    background: #FAF7EF;
    position: relative;
    box-sizing: border-box;
    padding: 0.18in 0.22in;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: 'Cinzel', 'Copperplate', 'Times New Roman', serif;
    color: #1A1816;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .tel {
    font-size: 6.5pt;
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  .firm {
    text-align: right;
  }
  .firm-name {
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 0.18em;
  }
  .firm-dept {
    font-size: 5pt;
    font-weight: 500;
    letter-spacing: 0.16em;
    color: #555;
    margin-top: 1px;
  }
  .center-content {
    text-align: center;
    margin-top: -4px;
  }
  .name {
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: 0.22em;
    margin: 0 0 2px 0;
  }
  .title {
    font-size: 6.8pt;
    font-weight: 600;
    letter-spacing: 0.26em;
    color: #333;
  }
  .sub-title {
    font-size: 5pt;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: #666;
    margin-top: 3px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 5pt;
    letter-spacing: 0.12em;
    font-weight: 500;
    color: #444;
  }
</style>
</head>
<body>
  <div class="card-page">
    <div class="header">
      <div class="tel">+998 88 223 33 34</div>
      <div class="firm">
        <div class="firm-name">ANTIGRAVITY SYSTEMS</div>
        <div class="firm-dept">COGNITIVE ARCHITECTURE & QUANTITATIVE SYSTEMS</div>
      </div>
    </div>
    <div class="center-content">
      <div class="name">JASUR SHUKUROV</div>
      <div class="title">CHIEF EXECUTIVE & LEAD AI ARCHITECT</div>
      <div class="sub-title">HEALTHCARE MANAGEMENT • LOW-LATENCY SYSTEMS • ARBITRAGE</div>
    </div>
    <div class="footer">
      <div>TELEGRAM & IG: @JASURCEO</div>
      <div>SAMARQAND STATE MEDICAL UNIVERSITY • SCHOOL 21</div>
      <div>SAMARKAND • TASHKENT</div>
    </div>
  </div>
</body>
</html>
