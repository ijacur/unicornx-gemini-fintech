<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NanoSurgeon 2050: Arterial Rush</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #020106;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameWrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 800px;
      aspect-ratio: 9 / 16;
      background: #040108;
      box-shadow: 0 0 60px rgba(230, 20, 70, 0.2);
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #introOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 40%, rgba(30, 4, 15, 0.7) 0%, rgba(4, 1, 8, 0.95) 75%);
    }
    .badge-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00ffff;
      background: rgba(0, 255, 255, 0.12);
      border: 1px solid rgba(0, 255, 255, 0.35);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      color: #ffffff;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 6px;
      text-shadow: 0 0 24px rgba(255, 40, 90, 0.7);
    }
    .neon-sub {
      color: #ff2a6d;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(255, 42, 109, 0.6);
    }
    .desc {
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.5;
      max-width: 290px;
      margin-bottom: 28px;
    }
    .features-list {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .features-list span {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .tap-start {
      color: #05ffa1;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: pulseAnim 1.1s infinite alternate ease-in-out;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.98); opacity: 0.85; text-shadow: 0 0 10px #05ffa1; }
      100% { transform: scale(1.06); opacity: 1; text-shadow: 0 0 25px #05ffa1, 0 0 40px #00ffff; }
    }
  </style>
</head>
<body>

  <div id="gameWrapper">
    <canvas id="mainCanvas" width="360" height="640"></canvas>
    
    <div id="introOverlay">
      <span class="badge-tag">HOORA • NANO-HEALTHTECH</span>
      <h1>NANOSURGEON</h1>
      <span class="neon-sub">ARTERIAL RUSH</span>
      <p class="desc">Pilot micro-probe through carotid artery. Collect Oxygen & EMP cells. Graze obstacles for bonus adrenaline!</p>
      <div class="features-list">
        <span>🛡️ Nanoshield</span>
        <span>💥 EMP Burst</span>
        <span>⚡ 60 FPS</span>
      </div>
      <div class="tap-start">TAP / TOUCH TO LAUNCH</div>
    </div>
  </div>

  <script>
    // =========================================================================
    // PROCEDURAL AUDIO SYNTHESIZER (100% Web Audio API • Pentatonic Harmony)
    // =========================================================================
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Pentatonic scale frequencies for melodic combo chimes (C4, D4, E4, G4, A4, C5, D5, E5, G5)
    const PENTATONIC = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3, 784.0];

    function playTone(freq, type, duration, slideFreq = null, vol = 0.2) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideFreq) {
          osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function sfxHeartbeat(speedMult) {
      playTone(55, 'sine', 0.09, 38, 0.22);
      setTimeout(() => {
        playTone(75, 'sine', 0.07, 45, 0.16);
      }, 120);
    }

    function sfxCollect(comboCount) {
      const idx = Math.min(comboCount - 1, PENTATONIC.length - 1);
      const note = PENTATONIC[Math.max(0, idx)];
      playTone(note, 'sine', 0.14, note * 1.5, 0.22);
    }

    function sfxShield() {
      playTone(350, 'triangle', 0.25, 700, 0.25);
    }

    function sfxEmp() {
      playTone(200, 'sawtooth', 0.45, 800, 0.3);
      setTimeout(() => playTone(880, 'sine', 0.3, 220, 0.25), 80);
    }

    function sfxGraze() {
      playTone(900, 'triangle', 0.05, 1200, 0.12);
    }

    function sfxShieldBreak() {
      playTone(220, 'square', 0.35, 60, 0.35);
    }

    function sfxCrash() {
      playTone(140, 'sawtooth', 0.6, 25, 0.45);
    }

    // =========================================================================
    // GAME ENGINE & CONFIGURATION
    // =========================================================================
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const introOverlay = document.getElementById('introOverlay');

    const V_W = 360;
    const V_H = 640;

    let gameState = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
    let score = 0;
    let highScore = parseInt(localStorage.getItem('nanosurgeon_record') || '0', 10);
    let combo = 0;
    let maxCombo = 0;
    let distance = 0;
    let speed = 4.2;
    let level = 1;
    let shake = 0;
    let flashColor = null;
    let flashAlpha = 0;
    let lastBeat = 0;

    // Player State (with Shield & Forgiving Hitbox)
    const player = {
      x: V_W / 2,
      y: V_H - 130,
      targetX: V_W / 2,
      targetY: V_H - 130,
      visualRadius: 16,
      hitboxRadius: 8, // Forgiving inner hitbox!
      shield: 1, // 1 = shield active, 0 = critical hull
      invulnTimer: 0,
      tilt: 0,
      trail: []
    };

    let obstacles = [];
    let pickups = [];
    let particles = [];
    let floatTexts = [];
    let shockwaves = [];
    let bgCells = [];

    // Background Organic Blood Cells
    for (let i = 0; i < 32; i++) {
      bgCells.push({
        x: Math.random() * V_W,
        y: Math.random() * V_H,
        radius: 12 + Math.random() * 24,
        speed: 1.0 + Math.random() * 2.6,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.03,
        alpha: 0.12 + Math.random() * 0.2
      });
    }

    function resetGame() {
      score = 0;
      combo = 0;
      maxCombo = 0;
      distance = 0;
      speed = 4.2;
      level = 1;
      shake = 0;
      flashAlpha = 0;
      player.x = V_W / 2;
      player.y = V_H - 130;
      player.targetX = V_W / 2;
      player.targetY = V_H - 130;
      player.shield = 1;
      player.invulnTimer = 0;
      player.trail = [];
      obstacles = [];
      pickups = [];
      particles = [];
      floatTexts = [];
      shockwaves = [];
    }

    // =========================================================================
    // RESPONSIVE TOUCH & MOUSE CONTROLS (Smart Finger Offset)
    // =========================================================================
    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const isTouch = e.touches && e.touches.length > 0;
      const clientX = isTouch ? e.touches[0].clientX : e.clientX;
      const clientY = isTouch ? e.touches[0].clientY : e.clientY;

      let x = ((clientX - rect.left) / rect.width) * V_W;
      let y = ((clientY - rect.top) / rect.height) * V_H;

      // Smart Touch Offset: If touched on mobile, steer 42px above thumb so finger doesn't block player!
      if (isTouch) {
        y -= 42;
      }

      return {
        x: Math.max(30, Math.min(V_W - 30, x)),
        y: Math.max(60, Math.min(V_H - 60, y))
      };
    }

    function onPointerDown(e) {
      e.preventDefault();
      ensureAudio();

      if (gameState === 'START') {
        gameState = 'PLAYING';
        introOverlay.style.opacity = '0';
        resetGame();
      } else if (gameState === 'GAMEOVER') {
        gameState = 'PLAYING';
        resetGame();
      } else if (gameState === 'PLAYING') {
        const p = getEventPos(e);
        player.targetX = p.x;
        player.targetY = p.y;
      }
    }

    function onPointerMove(e) {
      if (gameState !== 'PLAYING') return;
      e.preventDefault();
      const p = getEventPos(e);
      player.targetX = p.x;
      player.targetY = p.y;
    }

    window.addEventListener('pointerdown', onPointerDown, { passive: false });
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });

    // =========================================================================
    // SPAWNING SYSTEM & POWERUPS
    // =========================================================================
    let spawnTimer = 0;
    let pickupTimer = 0;

    function spawnObstacle() {
      const rand = Math.random();
      let type = 'VIRUS';
      let r = 16;

      if (rand < 0.45) {
        type = 'VIRUS';
        r = 16 + Math.random() * 4;
      } else if (rand < 0.78) {
        type = 'PLAQUE';
        r = 24 + Math.random() * 6;
      } else {
        type = 'SPIKE_CLUSTER';
        r = 14;
      }

      obstacles.push({
        type: type,
        x: 35 + Math.random() * (V_W - 70),
        y: -45,
        radius: r,
        hitRadius: r * 0.78, // Forgiving hit test
        speed: speed * (type === 'PLAQUE' ? 0.8 : (type === 'VIRUS' ? 1.05 : 1.2)),
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.05,
        grazed: false
      });
    }

    function spawnPickup() {
      const roll = Math.random();
      let type = 'OXYGEN'; // Cyan O2
      if (roll < 0.18 && player.shield === 0) {
        type = 'SHIELD'; // Emerald Shield Repair
      } else if (roll < 0.32) {
        type = 'EMP'; // Magenta Screen Wipe
      }

      pickups.push({
        type: type,
        x: 35 + Math.random() * (V_W - 70),
        y: -30,
        radius: 13,
        speed: speed * 0.9,
        phase: Math.random() * Math.PI * 2
      });
    }

    function createParticles(x, y, color, count = 14, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = (1.5 + Math.random() * 4.5) * speedMult;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(ang) * vel,
          vy: Math.sin(ang) * vel,
          size: 1.5 + Math.random() * 2.5,
          color: color,
          alpha: 1.0,
          decay: 0.02 + Math.random() * 0.03
        });
      }
    }

    function createShockwave(x, y, color = '#00ffff') {
      shockwaves.push({ x: x, y: y, r: 10, maxR: 160, color: color, alpha: 1.0 });
    }

    function addFloatText(x, y, text, color = '#00ffff') {
      floatTexts.push({ x: x, y: y, text: text, color: color, alpha: 1.0, vy: -1.8 });
    }

    function triggerScreenFlash(color, alpha = 0.4) {
      flashColor = color;
      flashAlpha = alpha;
    }

    // =========================================================================
    // 60 FPS UPDATE ENGINE
    // =========================================================================
    let lastFrameTime = performance.now();

    function update() {
      const now = performance.now();
      const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
      lastFrameTime = now;

      // Heartbeat pulse rhythm
      const beatInterval = Math.max(480, 1000 - (speed * 45));
      if (now - lastBeat > beatInterval) {
        if (gameState === 'PLAYING') sfxHeartbeat(speed);
        lastBeat = now;
      }

      // Screen Shake
      if (shake > 0) {
        shake *= 0.88;
        if (shake < 0.4) shake = 0;
      }

      // Flash Fade
      if (flashAlpha > 0) {
        flashAlpha -= dt * 2.5;
        if (flashAlpha < 0) flashAlpha = 0;
      }

      // Background Erythrocytes Flow
      bgCells.forEach(c => {
        c.y += c.speed * (gameState === 'PLAYING' ? speed * 0.35 : 1.2);
        c.rot += c.rotSpeed;
        if (c.y > V_H + 40) {
          c.y = -40;
          c.x = Math.random() * V_W;
        }
      });

      if (gameState === 'PLAYING') {
        distance += speed * dt * 8;
        speed = 4.2 + Math.min(distance * 0.0028, 5.5);

        // Level Up announcement
        const newLevel = 1 + Math.floor(score / 500);
        if (newLevel > level) {
          level = newLevel;
          addFloatText(V_W / 2, V_H / 2 - 40, `ZONE ${level}: ADRENALINE SURGE!`, '#05ffa1');
          triggerScreenFlash('#05ffa1', 0.25);
          sfxEmp();
        }

        // Smooth 1:1 Interpolation (Crisp Steering)
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        player.x += dx * 0.28;
        player.y += dy * 0.28;
        player.tilt = Math.max(-0.4, Math.min(0.4, dx * 0.035));

        // Nanobot Thruster Trail
        player.trail.unshift({ x: player.x, y: player.y + 12, alpha: 0.85 });
        if (player.trail.length > 10) player.trail.pop();
        player.trail.forEach(t => t.alpha *= 0.82);

        // Invulnerability countdown
        if (player.invulnTimer > 0) {
          player.invulnTimer -= dt;
        }

        // Spawning
        spawnTimer += dt;
        const targetSpawnDelay = Math.max(0.42, 1.1 - (speed * 0.07));
        if (spawnTimer >= targetSpawnDelay) {
          spawnObstacle();
          spawnTimer = 0;
        }

        pickupTimer += dt;
        if (pickupTimer >= 1.25) {
          spawnPickup();
          pickupTimer = 0;
        }

        // Update Obstacles & Collision / Graze
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.y += o.speed;
          o.rot += o.rotSpeed;

          const dist = Math.hypot(player.x - o.x, player.y - o.y);

          // 1. Graze Mechanic (Close call gives bonus + thrill!)
          if (!o.grazed && dist < player.visualRadius + o.radius + 14 && dist > player.hitboxRadius + o.hitRadius) {
            o.grazed = true;
            score += 15;
            sfxGraze();
            createParticles(player.x, player.y, '#00ffff', 6, 0.6);
            addFloatText(player.x, player.y - 18, '+15 GRAZE!', '#00ffff');
          }

          // 2. Collision Test
          if (dist < player.hitboxRadius + o.hitRadius) {
            if (player.invulnTimer <= 0) {
              if (player.shield > 0) {
                // Shield Absorbs the Hit!
                player.shield = 0;
                player.invulnTimer = 1.4; // 1.4s invulnerability
                shake = 14;
                triggerScreenFlash('#00ffff', 0.5);
                sfxShieldBreak();
                createShockwave(player.x, player.y, '#00ffff');
                createParticles(o.x, o.y, '#ff3366', 22);
                obstacles.splice(i, 1);
                addFloatText(player.x, player.y - 30, 'SHIELD BROKEN!', '#ff0055');
                continue;
              } else {
                // Critical Hull Breach -> Game Over!
                sfxCrash();
                shake = 22;
                triggerScreenFlash('#ff0044', 0.6);
                createParticles(player.x, player.y, '#ff3366', 45, 1.5);
                createParticles(player.x, player.y, '#ffcc00', 25, 1.2);
                createShockwave(player.x, player.y, '#ff2255');
                gameState = 'GAMEOVER';
                if (score > highScore) {
                  highScore = score;
                  localStorage.setItem('nanosurgeon_record', highScore.toString());
                }
                break;
              }
            }
          }

          if (o.y > V_H + 50) {
            obstacles.splice(i, 1);
            score += 10;
          }
        }

        // Update Pickups & Collection
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.y += p.speed;
          p.phase += 0.08;

          const dist = Math.hypot(player.x - p.x, player.y - p.y);
          if (dist < player.visualRadius + p.radius + 8) {
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            if (p.type === 'OXYGEN') {
              const pts = 25 * combo;
              score += pts;
              sfxCollect(combo);
              createParticles(p.x, p.y, '#00ffff', 14);
              addFloatText(p.x, p.y, `+${pts}${combo > 1 ? ` (${combo}X)` : ''}`, combo > 2 ? '#ffea00' : '#00ffff');
            } else if (p.type === 'SHIELD') {
              player.shield = 1;
              score += 100;
              sfxShield();
              triggerScreenFlash('#05ffa1', 0.35);
              createShockwave(player.x, player.y, '#05ffa1');
              createParticles(p.x, p.y, '#05ffa1', 20);
              addFloatText(p.x, p.y, 'SHIELD RESTORED! +100', '#05ffa1');
            } else if (p.type === 'EMP') {
              score += 150;
              sfxEmp();
              triggerScreenFlash('#ff00d4', 0.5);
              createShockwave(player.x, player.y, '#ff00d4');
              obstacles.forEach(ob => {
                createParticles(ob.x, ob.y, '#ff0055', 10);
                score += 20;
              });
              obstacles = [];
              addFloatText(player.x, player.y - 25, 'EMP SHOCKWAVE CLEARED!', '#ff00d4');
            }

            pickups.splice(i, 1);
            continue;
          }

          if (p.y > V_H + 30) {
            pickups.splice(i, 1);
            combo = 0;
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }

      // Update Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += 12;
        sw.alpha -= 0.05;
        if (sw.alpha <= 0 || sw.r >= sw.maxR) shockwaves.splice(i, 1);
      }

      // Update Floating Texts
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) floatTexts.splice(i, 1);
      }
    }

    // =========================================================================
    // RENDERING PIPELINE (High-Contrast Cyber-Biological Aesthetics)
    // =========================================================================
    function draw() {
      ctx.save();

      // Screen Shake Translation
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      // Artery Background
      ctx.fillStyle = '#060109';
      ctx.fillRect(0, 0, V_W, V_H);

      // Undulating Arterial Vessel Walls
      const wave = Math.sin(performance.now() * 0.0035) * 6;
      const gradLeft = ctx.createLinearGradient(0, 0, 45, 0);
      gradLeft.addColorStop(0, 'rgba(190, 10, 50, 0.55)');
      gradLeft.addColorStop(1, 'rgba(190, 10, 50, 0)');
      ctx.fillStyle = gradLeft;
      ctx.fillRect(0, 0, 36 + wave, V_H);

      const gradRight = ctx.createLinearGradient(V_W, 0, V_W - 45, 0);
      gradRight.addColorStop(0, 'rgba(190, 10, 50, 0.55)');
      gradRight.addColorStop(1, 'rgba(190, 10, 50, 0)');
      ctx.fillStyle = gradRight;
      ctx.fillRect(V_W - 36 - wave, 0, 36 + wave, V_H);

      // Erythrocytes
      bgCells.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.scale(1, 0.65);
        ctx.beginPath();
        ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(165, 18, 55, ${c.alpha})`;
        ctx.fill();
        ctx.restore();
      });

      // Render Shockwaves
      shockwaves.forEach(sw => {
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      });

      // Render Pickups
      pickups.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        const glow = Math.sin(p.phase) * 4;

        if (p.type === 'OXYGEN') {
          ctx.beginPath();
          ctx.arc(0, 0, p.radius + glow, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#00ffff';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 12;
          ctx.fill();

          ctx.fillStyle = '#001a1a';
          ctx.font = '900 10px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('O2', 0, 0);
        } else if (p.type === 'SHIELD') {
          ctx.beginPath();
          ctx.arc(0, 0, p.radius + glow, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(5, 255, 161, 0.25)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#05ffa1';
          ctx.shadowColor = '#05ffa1';
          ctx.shadowBlur = 14;
          ctx.fill();

          ctx.fillStyle = '#002615';
          ctx.font = '900 11px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🛡️', 0, 1);
        } else if (p.type === 'EMP') {
          ctx.beginPath();
          ctx.arc(0, 0, p.radius + glow, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 0, 212, 0.25)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#ff00d4';
          ctx.shadowColor = '#ff00d4';
          ctx.shadowBlur = 16;
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = '900 10px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('⚡', 0, 0);
        }
        ctx.restore();
      });

      // Render Obstacles (Viruses, Plaques, Spikes)
      obstacles.forEach(o => {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.rot);

        if (o.type === 'VIRUS') {
          const spikes = 8;
          ctx.beginPath();
          for (let s = 0; s < spikes * 2; s++) {
            const rad = s % 2 === 0 ? o.radius + 6 : o.radius - 2;
            const a = (s / (spikes * 2)) * Math.PI * 2;
            const sx = Math.cos(a) * rad;
            const sy = Math.sin(a) * rad;
            if (s === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.closePath();
          ctx.fillStyle = '#ff0055';
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 12;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 0, o.radius * 0.45, 0, Math.PI * 2);
          ctx.fillStyle = '#4a0015';
          ctx.fill();
        } else if (o.type === 'PLAQUE') {
          ctx.beginPath();
          ctx.ellipse(0, 0, o.radius, o.radius * 0.65, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#eab308';
          ctx.shadowColor = '#ca8a04';
          ctx.shadowBlur = 10;
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(0, 0, o.radius * 0.5, o.radius * 0.35, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#854d0e';
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, o.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#b91c1c';
          ctx.shadowColor = '#dc2626';
          ctx.shadowBlur = 8;
          ctx.fill();
        }
        ctx.restore();
      });

      // Render Player (Nanobot)
      if (gameState !== 'GAMEOVER') {
        // Thruster Particle Ribbon
        player.trail.forEach(t => {
          ctx.beginPath();
          ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 255, 255, ${t.alpha})`;
          ctx.fill();
        });

        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.tilt);

        // Invulnerability Blink
        if (player.invulnTimer > 0 && Math.floor(performance.now() / 80) % 2 === 0) {
          ctx.globalAlpha = 0.45;
        }

        // Nanoshield Bubble
        if (player.shield > 0) {
          ctx.beginPath();
          ctx.arc(0, 0, player.visualRadius + 7, 0, Math.PI * 2);
          ctx.strokeStyle = '#05ffa1';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#05ffa1';
          ctx.shadowBlur = 14;
          ctx.stroke();
          ctx.fillStyle = 'rgba(5, 255, 161, 0.12)';
          ctx.fill();
        }

        // Nanobot Hull
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(15, 12);
        ctx.lineTo(0, 7);
        ctx.lineTo(-15, 12);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // Core Cockpit Eye
        ctx.beginPath();
        ctx.arc(0, -3, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 10;
        ctx.fill();

        // Hull Edge Neon Accents
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      // Render Particles
      particles.forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // Render Floating Texts
      floatTexts.forEach(ft => {
        ctx.save();
        ctx.font = '900 13px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });

      // Screen Flash Overlay (Damage / Powerup)
      if (flashAlpha > 0 && flashColor) {
        ctx.fillStyle = flashColor;
        ctx.globalAlpha = flashAlpha;
        ctx.fillRect(0, 0, V_W, V_H);
        ctx.globalAlpha = 1.0;
      }

      // =======================================================================
      // HUD (Heads-Up Display)
      // =======================================================================
      if (gameState === 'PLAYING') {
        // Modern Glassmorphism Top Bar
        ctx.fillStyle = 'rgba(10, 3, 14, 0.75)';
        ctx.fillRect(14, 14, V_W - 28, 46);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.strokeRect(14, 14, V_W - 28, 46);

        // Score
        ctx.font = '900 20px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.fillText(`${score} PTS`, 26, 44);

        // Shield Indicator
        ctx.fillStyle = player.shield > 0 ? '#05ffa1' : '#ff0055';
        ctx.font = '800 11px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(player.shield > 0 ? 'SHIELD: OK' : 'HULL: CRITICAL', 140, 42);

        // Combo Multiplier
        ctx.font = '900 13px monospace';
        ctx.fillStyle = combo > 1 ? '#ffea00' : '#64748b';
        ctx.textAlign = 'right';
        ctx.fillText(combo > 1 ? `${combo}X COMBO` : `HI: ${highScore}`, V_W - 26, 43);
      }

      // =======================================================================
      // GAME OVER MODAL (Instant Tap-To-Replay)
      // =======================================================================
      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(4, 1, 8, 0.88)';
        ctx.fillRect(0, 0, V_W, V_H);

        ctx.textAlign = 'center';

        ctx.fillStyle = '#ff0055';
        ctx.font = '900 11px monospace';
        ctx.fillText('● SYSTEM TRAUMA DETECTED ●', V_W / 2, V_H / 2 - 95);

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 36px -apple-system, sans-serif';
        ctx.fillText('MISSION FAILED', V_W / 2, V_H / 2 - 55);

        // Score Card
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.fillRect(V_W / 2 - 125, V_H / 2 - 30, 250, 92);
        ctx.strokeRect(V_W / 2 - 125, V_H / 2 - 30, 250, 92);

        ctx.font = '700 11px monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('FINAL SCORE', V_W / 2, V_H / 2 - 10);

        ctx.font = '900 28px monospace';
        ctx.fillStyle = '#00ffff';
        ctx.fillText(`${score}`, V_W / 2, V_H / 2 + 22);

        ctx.font = '700 10px monospace';
        ctx.fillStyle = score >= highScore ? '#ffea00' : '#64748b';
        ctx.fillText(score >= highScore ? '★ NEW ALL-TIME RECORD! ★' : `BEST: ${highScore} PTS • MAX COMBO: ${maxCombo}X`, V_W / 2, V_H / 2 + 46);

        // Play Again Button (Tactile Glow)
        ctx.fillStyle = '#ff2a6d';
        ctx.shadowColor = '#ff2a6d';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.roundRect(V_W / 2 - 100, V_H / 2 + 84, 200, 46, 12);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 14px monospace';
        ctx.fillText('PLAY AGAIN ↺', V_W / 2, V_H / 2 + 112);
      }

      ctx.restore();
    }

    // =========================================================================
    // TICK LOOP
    // =========================================================================
    function tick() {
      update();
      draw();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
